[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-policy-studio"
version = "0.1.0"
description = "Visual, versioned credit decision policies served on Vertex AI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Credit Policy Studio contributors" }]
dependencies = [
  "fastapi>=0.116,<1",
  "google-cloud-aiplatform>=1.111,<2",
  "google-cloud-bigquery>=3.35,<4",
  "google-cloud-storage>=3.3,<4",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
aws = [
  "boto3>=1.35,<2",
]
dev = [
  "boto3>=1.35,<2",
  "httpx>=0.28,<1",
  "moto[s3]>=5.1,<6",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --disable-warnings --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
